spring.application.name=HouseWith-BE

# 서버 포트
server.port=80

# DB 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://ditanet.duckdns.org:8306/HouseWith?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
